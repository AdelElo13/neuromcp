name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lint output is Node-version independent, and ESLint 10 does not
      # support Node 18 (its stylish formatter needs util.styleText, so it
      # crashes the moment there is any output to print). Run once, on the
      # newest matrix entry.
      - name: Type check
        if: matrix.node-version == 22
        run: npm run lint

      - name: Tool docs up to date
        run: npm run docs:tools:check

      - name: Download ONNX model
        run: npx tsx scripts/download-model.ts

      # Build before tests so integration specs that invoke the published
      # bins (bin/embed.mjs etc.) can resolve ../dist/embeddings/factory.js.
      - name: Build
        run: npm run build

      # sprint1 Q6: only run coverage on the latest Node — instrumentation
      # adds overhead and varies between v8 versions. Other matrix entries
      # run plain tests for compatibility checking.
      - name: Run tests (Node 18, 20)
        if: matrix.node-version != 22
        run: npm test

      - name: Run tests with coverage (Node 22)
        if: matrix.node-version == 22
        run: npm run test:coverage

      - name: Upload coverage report
        # if: always() — capture coverage even when tests fail; that's exactly
        # the moment you want the report for debugging.
        if: always() && matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

