name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Download ONNX model
        run: npx tsx scripts/download-model.ts

      # Build before tests so integration specs that invoke the published
      # bins (bin/embed.mjs etc.) can resolve ../dist/embeddings/factory.js.
      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
